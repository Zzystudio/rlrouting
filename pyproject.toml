[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlrouting"
version = "0.1.0"
description = "Noise-adaptive quantum circuit routing via reinforcement learning and graph neural networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhaoyu Zheng", email = "zh20011231@mail.ustc.edu.cn" }]
dependencies = [
    "numpy>=1.24",
    "qiskit>=2.5",
    "qiskit-aer>=0.17",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "networkx>=3.0",
    "gymnasium>=0.29",
    "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["routing", "routing.graph", "routing.gnn", "routing.rl", "utils", "sim"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
